global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: ddos-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: ddos-metrics
    static_configs:
      - targets: ["metrics:9100"]
        labels:
          component: metrics

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

